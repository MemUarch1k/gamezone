<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEON ARCADE · 10 Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #050510;
  --surface: #0a0a1a;
  --pink: #ff0055;
  --cyan: #00f3ff;
  --lime: #ccff00;
  --purple: #bc13fe;
  --orange: #ff9900;
  --text: #e0e0ff;
  --dim: #666688;
}

* { box-sizing: border-box; margin: 0; padding: 0; cursor: none !important; }
body { background: var(--bg); color: var(--text); font-family: 'Rajdhani', sans-serif; overflow-x: hidden; min-height: 100vh; }
h1, h2, h3, .mono { font-family: 'Orbitron', sans-serif; }

/* --- CUSTOM CURSOR --- */
.cursor-dot, .cursor-outline {
  position: fixed; top: 0; left: 0; transform: translate(-50%, -50%);
  border-radius: 50%; pointer-events: none; z-index: 9999;
}
.cursor-dot { width: 8px; height: 8px; background: #fff; mix-blend-mode: difference; }
.cursor-outline {
  width: 30px; height: 30px; border: 2px solid var(--cyan);
  transition: width 0.2s, height 0.2s, border-color 0.2s;
}
body.hovering .cursor-outline { width: 50px; height: 50px; border-color: var(--pink); background: rgba(255,0,85,0.1); }

/* --- BACKGROUND FX --- */
.bg-grid {
  position: fixed; inset: 0; z-index: -1;
  background-image: 
    linear-gradient(var(--surface) 1px, transparent 1px),
    linear-gradient(90deg, var(--surface) 1px, transparent 1px);
  background-size: 40px 40px;
  opacity: 0.3;
  animation: gridMove 20s linear infinite;
}
@keyframes gridMove { from { background-position: 0 0; } to { background-position: 40px 40px; } }
.vignette { position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at center, transparent 40%, #000 100%); pointer-events: none; }

/* --- UI LAYOUT --- */
header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 20px 40px; border-bottom: 1px solid rgba(255,255,255,0.1);
  backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100;
}
.logo { font-size: 24px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; color: #fff; text-shadow: 0 0 10px var(--cyan); }
.logo span { color: var(--pink); }
.sound-toggle { background: none; border: 1px solid var(--dim); color: var(--dim); padding: 8px 16px; font-family: 'Orbitron'; font-size: 12px; transition: 0.3s; }
.sound-toggle:hover { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
.sound-toggle.active { border-color: var(--lime); color: var(--lime); box-shadow: 0 0 10px var(--lime); }

main { max-width: 1400px; margin: 0 auto; padding: 40px 20px; }
.hero { text-align: center; margin-bottom: 60px; }
.hero h1 { font-size: clamp(40px, 8vw, 80px); line-height: 1; margin-bottom: 10px; }
.hero p { color: var(--dim); font-size: 18px; max-width: 600px; margin: 0 auto; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }
.card {
  background: var(--surface); border: 1px solid rgba(255,255,255,0.05);
  border-radius: 12px; overflow: hidden; transition: 0.3s;
  position: relative; display: flex; flex-direction: column;
}
.card:hover { transform: translateY(-5px); border-color: var(--accent); box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px var(--accent-glow); }
.card-preview { height: 180px; background: #000; position: relative; overflow: hidden; }
.card-preview canvas { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.8); transition: 0.3s; }
.card:hover .card-preview canvas { filter: brightness(1.2); transform: scale(1.05); }
.card-info { padding: 20px; flex: 1; display: flex; flex-direction: column; }
.card-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; color: #fff; }
.card-desc { font-size: 14px; color: var(--dim); margin-bottom: 16px; flex: 1; }
.btn-play {
  width: 100%; padding: 12px; background: transparent; border: 1px solid var(--accent);
  color: var(--accent); font-family: 'Orbitron'; font-weight: 700; letter-spacing: 1px;
  transition: 0.2s; text-transform: uppercase;
}
.btn-play:hover { background: var(--accent); color: #000; box-shadow: 0 0 15px var(--accent); }

/* --- GAME MODAL --- */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000;
  display: none; justify-content: center; align-items: center; backdrop-filter: blur(5px);
}
.modal-overlay.open { display: flex; }
.game-container {
  width: 90vw; height: 90vh; max-width: 1000px; max-height: 800px;
  background: #000; border: 2px solid var(--accent); border-radius: 8px;
  position: relative; box-shadow: 0 0 50px var(--accent-glow);
  display: flex; flex-direction: column;
}
.game-header {
  padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.5);
}
.game-title { font-size: 18px; font-weight: 700; color: var(--accent); }
.game-controls { display: flex; gap: 10px; }
.ctrl-btn { background: none; border: 1px solid var(--dim); color: var(--dim); width: 36px; height: 36px; border-radius: 4px; font-size: 16px; transition: 0.2s; }
.ctrl-btn:hover { border-color: #fff; color: #fff; }
.canvas-wrapper { flex: 1; position: relative; background: #050505; overflow: hidden; }
#gameCanvas { width: 100%; height: 100%; display: block; touch-action: none; }
.overlay-screen {
  position: absolute; inset: 0; background: rgba(0,0,0,0.85);
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  z-index: 10; text-align: center; padding: 20px;
}
.overlay-hidden { display: none !important; }
.ov-title { font-size: 40px; color: #fff; margin-bottom: 10px; text-shadow: 0 0 20px var(--accent); }
.ov-msg { color: var(--dim); margin-bottom: 30px; font-size: 18px; }
.ov-btn {
  padding: 15px 40px; font-size: 18px; font-family: 'Orbitron'; font-weight: 700;
  background: var(--accent); color: #000; border: none; border-radius: 4px;
  box-shadow: 0 0 20px var(--accent); transition: 0.2s;
}
.ov-btn:hover { transform: scale(1.05); box-shadow: 0 0 30px var(--accent); }
.hud-score { position: absolute; top: 20px; right: 20px; font-family: 'Orbitron'; font-size: 24px; color: #fff; text-shadow: 0 0 10px var(--accent); pointer-events: none; }

/* Mobile adjustments */
@media (max-width: 768px) {
  header { padding: 15px; }
  .logo { font-size: 18px; }
  main { padding: 20px 10px; }
  .grid { grid-template-columns: 1fr; }
  .game-container { width: 100vw; height: 100vh; max-width: none; max-height: none; border-radius: 0; border: none; }
  .cursor-dot, .cursor-outline { display: none; }
  * { cursor: auto !important; }
}
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="vignette"></div>
<div class="cursor-dot"></div>
<div class="cursor-outline"></div>

<header>
  <div class="logo">NEON<span>ARCADE</span></div>
  <button class="sound-toggle" id="soundBtn">SOUND: OFF</button>
</header>

<main>
  <section class="hero">
    <h1>SELECT GAME</h1>
    <p>10 аркадных шедевров в стиле киберпанк. Нажми PLAY, чтобы запустить процедурную музыку и начать игру.</p>
  </section>
  <div class="grid" id="gameGrid"></div>
</main>

<!-- Game Modal -->
<div class="modal-overlay" id="gameModal">
  <div class="game-container" id="gameContainer">
    <div class="game-header">
      <div class="game-title" id="modalTitle">GAME NAME</div>
      <div class="game-controls">
        <button class="ctrl-btn" id="restartBtn" title="Restart">↺</button>
        <button class="ctrl-btn" id="closeBtn" title="Exit">✕</button>
      </div>
    </div>
    <div class="canvas-wrapper">
      <canvas id="gameCanvas"></canvas>
      <div class="hud-score" id="hudScore">SCORE: 0</div>
      
      <!-- Start Overlay -->
      <div class="overlay-screen" id="startOverlay">
        <h2 class="ov-title" id="ovTitle">READY?</h2>
        <p class="ov-msg" id="ovDesc">Instructions here...</p>
        <button class="ov-btn" id="startGameBtn">START MISSION</button>
      </div>

      <!-- Game Over Overlay -->
      <div class="overlay-screen overlay-hidden" id="endOverlay">
        <h2 class="ov-title">GAME OVER</h2>
        <p class="ov-msg" id="finalScoreText">Score: 0</p>
        <button class="ov-btn" id="retryBtn">TRY AGAIN</button>
      </div>
    </div>
  </div>
</div>

<script>
/**
 * NEON ARCADE ENGINE v2.0
 * Fixed architecture, single loop manager, robust audio synth.
 */

// --- UTILS ---
const rand = (min, max) => Math.random() * (max - min) + min;
const randInt = (min, max) => Math.floor(rand(min, max + 1));
const clamp = (val, min, max) => Math.min(Math.max(val, min), max);
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const checkRectCollide = (r1, r2) => !(r1.x > r2.x + r2.w || r1.x + r1.w < r2.x || r1.y > r2.y + r2.h || r1.y + r1.h < r2.y);
const checkCircleCollide = (c1, c2) => dist(c1.x, c1.y, c2.x, c2.y) < c1.r + c2.r;

// --- AUDIO SYSTEM (Web Audio API) ---
class AudioSynth {
  constructor() {
    this.ctx = null;
    this.masterGain = null;
    this.isPlaying = false;
    this.currentTrack = 'silence';
    this.nextNoteTime = 0;
    this.step = 0;
    this.timerID = null;
    this.bpm = 120;
    
    // Simple sequencer patterns per game
    this.tracks = {
      lobby: { bpm: 100, bass: [45, 45, 48, 48, 43, 43, 41, 41], lead: [null, 60, null, 64, null, 67, null, 72] },
      snake: { bpm: 130, bass: [40, 40, 40, 40, 43, 43, 43, 43], lead: [null, null, 52, null, null, null, 55, null] },
      breakout: { bpm: 125, bass: [36, 36, 38, 38, 40, 40, 43, 43], lead: [60, 64, 67, 72, 67, 64, 60, 55] },
      tetris: { bpm: 140, bass: [45, 45, 41, 41, 43, 43, 40, 40], lead: [null, 57, 60, 64, 60, 57, 53, 57] },
      invaders: { bpm: 110, bass: [33, 33, 33, 33, 36, 36, 36, 36], lead: [null, null, null, null, null, null, null, null] },
      flappy: { bpm: 100, bass: [43, 43, 45, 45, 47, 47, 43, 43], lead: [null, 60, null, 62, null, 64, null, 62] },
      asteroids: { bpm: 90, bass: [31, 31, 31, 31, 34, 34, 34, 34], lead: [null, null, null, null, null, null, null, null] },
      pong: { bpm: 120, bass: [40, 40, 40, 40, 40, 40, 40, 40], lead: [null, null, null, null, null, null, null, null] },
      whack: { bpm: 135, bass: [45, 45, 48, 48, 45, 45, 43, 43], lead: [null, 60, 63, 67, 63, 60, 55, 51] },
      memory: { bpm: 95, bass: [41, 41, 44, 44, 41, 41, 39, 39], lead: [null, 57, null, 60, null, 64, null, 60] },
      runner: { bpm: 150, bass: [36, 36, 39, 39, 42, 42, 39, 39], lead: [null, 64, 67, 71, 67, 64, 60, 64] }
    };
  }

  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    this.ctx = new AC();
    this.masterGain = this.ctx.createGain();
    this.masterGain.gain.value = 0.3; // Master volume
    this.masterGain.connect(this.ctx.destination);
  }

  setVolume(v) {
    if (this.masterGain) this.masterGain.gain.setTargetAtTime(v, this.ctx.currentTime, 0.1);
  }

  toggleMute() {
    if (!this.ctx) this.init();
    if (this.ctx.state === 'suspended') this.ctx.resume();
    
    if (this.isPlaying) {
      this.stopMusic();
      return false;
    } else {
      this.playMusic('lobby');
      return true;
    }
  }

  playMusic(trackName) {
    if (!this.ctx) this.init();
    if (this.ctx.state === 'suspended') this.ctx.resume();
    
    this.stopMusic();
    this.currentTrack = trackName;
    this.isPlaying = true;
    this.step = 0;
    this.nextNoteTime = this.ctx.currentTime + 0.1;
    this.scheduler();
  }

  stopMusic() {
    this.isPlaying = false;
    clearTimeout(this.timerID);
  }

  scheduler() {
    if (!this.isPlaying) return;
    const lookahead = 0.1;
    while (this.nextNoteTime < this.ctx.currentTime + lookahead) {
      this.scheduleStep(this.step, this.nextNoteTime);
      const secondsPerBeat = 60.0 / this.tracks[this.currentTrack].bpm;
      this.nextNoteTime += 0.25 * secondsPerBeat; // 16th notes
      this.step++;
    }
    this.timerID = setTimeout(() => this.scheduler(), 25);
  }

  scheduleStep(step, time) {
    const track = this.tracks[this.currentTrack];
    const s = step % 8;
    
    // Bass
    if (track.bass[s]) {
      this.playNote(time, track.bass[s], 'triangle', 0.15, 0.2);
    }
    
    // Lead (Arpeggio/Melody)
    if (track.lead[s]) {
      this.playNote(time, track.lead[s], 'square', 0.08, 0.15);
    }

    // Drums (Simple kick/snare simulation using noise/freq drops)
    if (s % 2 === 0) this.playKick(time);
    if (s % 4 === 2) this.playSnare(time);
  }

  playNote(time, midi, type, vol, dur) {
    const freq = 440 * Math.pow(2, (midi - 69) / 12);
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, time);
    gain.gain.setValueAtTime(vol, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + dur);
    osc.connect(gain);
    gain.connect(this.masterGain);
    osc.start(time);
    osc.stop(time + dur + 0.1);
  }

  playKick(time) {
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.frequency.setValueAtTime(150, time);
    osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.1);
    gain.gain.setValueAtTime(0.3, time);
    gain.gain.exponentialRampToValueAtTime(0.01, time + 0.1);
    osc.connect(gain);
    gain.connect(this.masterGain);
    osc.start(time);
    osc.stop(time + 0.15);
  }

  playSnare(time) {
    const bufferSize = this.ctx.sampleRate * 0.1;
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    
    const noise = this.ctx.createBufferSource();
    noise.buffer = buffer;
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'highpass';
    filter.frequency.value = 1000;
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.2, time);
    gain.gain.exponentialRampToValueAtTime(0.01, time + 0.1);
    
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(this.masterGain);
    noise.start(time);
    noise.stop(time + 0.15);
  }

  // SFX
  sfx(type) {
    if (!this.ctx || this.ctx.state !== 'running') return;
    const now = this.ctx.currentTime;
    switch(type) {
      case 'collect': this.playNote(now, 80, 'sine', 0.2, 0.1); break;
      case 'hit': this.playNote(now, 40, 'sawtooth', 0.3, 0.2); break;
      case 'jump': this.playNote(now, 60, 'square', 0.15, 0.1); this.playNote(now+0.05, 70, 'square', 0.15, 0.1); break;
      case 'die': this.playNote(now, 30, 'sawtooth', 0.4, 0.5); this.playNote(now+0.1, 20, 'sawtooth', 0.4, 0.5); break;
      case 'click': this.playNote(now, 75, 'sine', 0.1, 0.05); break;
    }
  }
}

const Synth = new AudioSynth();

// --- INPUT MANAGER ---
const Input = {
  keys: {},
  mouse: { x: 0, y: 0, down: false },
  touches: [],
  
  init(canvas) {
    window.addEventListener('keydown', e => { this.keys[e.code] = true; });
    window.addEventListener('keyup', e => { this.keys[e.code] = false; });
    
    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      this.mouse.x = (e.clientX - rect.left) * (canvas.width / rect.width);
      this.mouse.y = (e.clientY - rect.top) * (canvas.height / rect.height);
    });
    canvas.addEventListener('mousedown', () => { this.mouse.down = true; Synth.sfx('click'); });
    canvas.addEventListener('mouseup', () => { this.mouse.down = false; });
    
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const t = e.touches[0];
      this.mouse.x = (t.clientX - rect.left) * (canvas.width / rect.width);
      this.mouse.y = (t.clientY - rect.top) * (canvas.height / rect.height);
      this.mouse.down = true;
      Synth.sfx('click');
    }, {passive: false});
    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const t = e.touches[0];
      this.mouse.x = (t.clientX - rect.left) * (canvas.width / rect.width);
      this.mouse.y = (t.clientY - rect.top) * (canvas.height / rect.height);
    }, {passive: false});
    canvas.addEventListener('touchend', () => { this.mouse.down = false; });
  },
  
  clear() {
    this.keys = {};
    this.mouse.down = false;
  }
};

// --- GAME BASE CLASS ---
class Game {
  constructor(canvas, ctx, width, height, onGameOver, onUpdateScore) {
    this.canvas = canvas;
    this.ctx = ctx;
    this.W = width;
    this.H = height;
    this.onGameOver = onGameOver;
    this.onUpdateScore = onUpdateScore;
    this.score = 0;
    this.running = false;
    this.lastTime = 0;
    this.particles = [];
  }

  start() {
    this.running = true;
    this.reset();
    this.loop = this.loop.bind(this);
    requestAnimationFrame(this.loop);
  }

  stop() {
    this.running = false;
  }

  reset() {
    this.score = 0;
    this.particles = [];
    this.onUpdateScore(0);
  }

  addScore(n) {
    this.score += n;
    this.onUpdateScore(this.score);
  }

  createExplosion(x, y, color, count = 10) {
    for(let i=0; i<count; i++) {
      this.particles.push({
        x, y,
        vx: rand(-5, 5), vy: rand(-5, 5),
        life: 1.0, decay: rand(0.02, 0.05),
        color, size: rand(2, 5)
      });
    }
  }

  updateParticles(dt) {
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;
      if (p.life <= 0) this.particles.splice(i, 1);
    }
  }

  drawParticles() {
    this.particles.forEach(p => {
      this.ctx.globalAlpha = p.life;
      this.ctx.fillStyle = p.color;
      this.ctx.beginPath();
      this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      this.ctx.fill();
      this.ctx.globalAlpha = 1;
    });
  }

  gameOver() {
    this.running = false;
    Synth.sfx('die');
    this.onGameOver(this.score);
  }

  loop(timestamp) {
    if (!this.running) return;
    const dt = Math.min((timestamp - this.lastTime) / 1000, 0.1);
    this.lastTime = timestamp;
    
    this.update(dt);
    this.draw();
    
    requestAnimationFrame(this.loop);
  }

  update(dt) {}
  draw() {}
}

// --- THE 10 GAMES IMPLEMENTATIONS ---

// 1. SNAKE
class Snake extends Game {
  reset() {
    super.reset();
    this.grid = 20;
    this.cols = Math.floor(this.W / this.grid);
    this.rows = Math.floor(this.H / this.grid);
    this.snake = [{x: 5, y: 5}, {x: 4, y: 5}, {x: 3, y: 5}];
    this.dir = {x: 1, y: 0};
    this.nextDir = {x: 1, y: 0};
    this.food = this.spawnFood();
    this.speed = 0.15;
    this.acc = 0;
  }
  spawnFood() {
    let f;
    do {
      f = { x: randInt(0, this.cols-1), y: randInt(0, this.rows-1) };
    } while (this.snake.some(s => s.x === f.x && s.y === f.y));
    return f;
  }
  update(dt) {
    // Input
    if (Input.keys['ArrowUp'] || Input.keys['KeyW']) if (this.dir.y === 0) this.nextDir = {x: 0, y: -1};
    if (Input.keys['ArrowDown'] || Input.keys['KeyS']) if (this.dir.y === 0) this.nextDir = {x: 0, y: 1};
    if (Input.keys['ArrowLeft'] || Input.keys['KeyA']) if (this.dir.x === 0) this.nextDir = {x: -1, y: 0};
    if (Input.keys['ArrowRight'] || Input.keys['KeyD']) if (this.dir.x === 0) this.nextDir = {x: 1, y: 0};

    this.acc += dt;
    if (this.acc > this.speed) {
      this.acc = 0;
      this.dir = this.nextDir;
      const head = { x: this.snake[0].x + this.dir.x, y: this.snake[0].y + this.dir.y };
      
      // Wall/Self Collision
      if (head.x < 0 || head.x >= this.cols || head.y < 0 || head.y >= this.rows || this.snake.some(s => s.x === head.x && s.y === head.y)) {
        this.gameOver();
        return;
      }
      
      this.snake.unshift(head);
      if (head.x === this.food.x && head.y === this.food.y) {
        this.addScore(10);
        Synth.sfx('collect');
        this.createExplosion(head.x * this.grid + this.grid/2, head.y * this.grid + this.grid/2, '#ccff00');
        this.food = this.spawnFood();
        this.speed = Math.max(0.05, this.speed * 0.98);
      } else {
        this.snake.pop();
      }
    }
    this.updateParticles(dt);
  }
  draw() {
    this.ctx.fillStyle = '#050510';
    this.ctx.fillRect(0, 0, this.W, this.H);
    
    // Grid lines (subtle)
    this.ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    this.ctx.lineWidth = 1;
    for(let i=0; i<this.cols; i++) { this.ctx.beginPath(); this.ctx.moveTo(i*this.grid, 0); this.ctx.lineTo(i*this.grid, this.H); this.ctx.stroke(); }
    for(let i=0; i<this.rows; i++) { this.ctx.beginPath(); this.ctx.moveTo(0, i*this.grid); this.ctx.lineTo(this.W, i*this.grid); this.ctx.stroke(); }

    // Food
    this.ctx.shadowBlur = 15;
    this.ctx.shadowColor = '#ff0055';
    this.ctx.fillStyle = '#ff0055';
    this.ctx.beginPath();
    this.ctx.arc(this.food.x * this.grid + this.grid/2, this.food.y * this.grid + this.grid/2, this.grid/2 - 2, 0, Math.PI*2);
    this.ctx.fill();
    
    // Snake
    this.ctx.shadowColor = '#ccff00';
    this.ctx.fillStyle = '#ccff00';
    this.snake.forEach((seg, i) => {
      const alpha = 1 - (i / this.snake.length) * 0.5;
      this.ctx.globalAlpha = alpha;
      this.ctx.fillRect(seg.x * this.grid + 1, seg.y * this.grid + 1, this.grid - 2, this.grid - 2);
    });
    this.ctx.globalAlpha = 1;
    this.ctx.shadowBlur = 0;
    
    this.drawParticles();
  }
}

// 2. BREAKOUT
class Breakout extends Game {
  reset() {
    super.reset();
    this.paddle = { w: 100, h: 15, x: this.W/2 - 50, y: this.H - 40 };
    this.ball = { x: this.W/2, y: this.H - 60, dx: 4, dy: -4, r: 8 };
    this.bricks = [];
    const rows = 5, cols = 8;
    const bw = (this.W - 40) / cols;
    const bh = 20;
    for(let r=0; r<rows; r++) {
      for(let c=0; c<cols; c++) {
        this.bricks.push({ x: 20 + c*bw, y: 50 + r*bh, w: bw-2, h: bh-2, active: true, color: ['#ff0055','#ff9900','#ccff00','#00f3ff','#bc13fe'][r] });
      }
    }
  }
  update(dt) {
    // Paddle Move
    if (Input.keys['ArrowLeft']) this.paddle.x -= 7;
    if (Input.keys['ArrowRight']) this.paddle.x += 7;
    if (Input.mouse.x > 0) this.paddle.x = Input.mouse.x - this.paddle.w/2;
    this.paddle.x = clamp(this.paddle.x, 0, this.W - this.paddle.w);

    // Ball Move
    this.ball.x += this.ball.dx;
    this.ball.y += this.ball.dy;

    // Walls
    if (this.ball.x < this.ball.r || this.ball.x > this.W - this.ball.r) this.ball.dx *= -1;
    if (this.ball.y < this.ball.r) this.ball.dy *= -1;
    if (this.ball.y > this.H) this.gameOver();

    // Paddle Collide
    if (this.ball.y + this.ball.r > this.paddle.y && this.ball.y - this.ball.r < this.paddle.y + this.paddle.h &&
        this.ball.x > this.paddle.x && this.ball.x < this.paddle.x + this.paddle.w) {
      this.ball.dy *= -1;
      // Add spin based on hit position
      const hitPoint = (this.ball.x - (this.paddle.x + this.paddle.w/2)) / (this.paddle.w/2);
      this.ball.dx = hitPoint * 5;
      Synth.sfx('hit');
    }

    // Brick Collide
    for (let b of this.bricks) {
      if (!b.active) continue;
      if (this.ball.x > b.x && this.ball.x < b.x + b.w && this.ball.y > b.y && this.ball.y < b.y + b.h) {
        b.active = false;
        this.ball.dy *= -1;
        this.addScore(5);
        Synth.sfx('collect');
        this.createExplosion(b.x + b.w/2, b.y + b.h/2, b.color, 5);
        break;
      }
    }
    
    if (this.bricks.every(b => !b.active)) {
      this.addScore(100);
      this.reset(); // Next level logic simplified to restart with score kept? No, just win screen or harder. Let's just respawn bricks for endless mode demo.
      this.bricks.forEach(b => b.active = true);
    }
    this.updateParticles(dt);
  }
  draw() {
    this.ctx.fillStyle = '#050510';
    this.ctx.fillRect(0, 0, this.W, this.H);
    
    // Bricks
    this.bricks.forEach(b => {
      if (!b.active) return;
      this.ctx.fillStyle = b.color;
      this.ctx.shadowBlur = 10;
      this.ctx.shadowColor = b.color;
      this.ctx.fillRect(b.x, b.y, b.w, b.h);
    });
    
    // Paddle
    this.ctx.fillStyle = '#00f3ff';
    this.ctx.shadowColor = '#00f3ff';
    this.ctx.fillRect(this.paddle.x, this.paddle.y, this.paddle.w, this.paddle.h);
    
    // Ball
    this.ctx.fillStyle = '#fff';
    this.ctx.shadowColor = '#fff';
    this.ctx.beginPath();
    this.ctx.arc(this.ball.x, this.ball.y, this.ball.r, 0, Math.PI*2);
    this.ctx.fill();
    this.ctx.shadowBlur = 0;
    
    this.drawParticles();
  }
}

// 3. TETRIS
class Tetris extends Game {
  reset() {
    super.reset();
    this.cols = 10; this.rows = 20;
    this.blockSize = Math.min(this.W / this.cols, this.H / this.rows);
    this.offsetX = (this.W - this.cols * this.blockSize) / 2;
    this.offsetY = (this.H - this.rows * this.blockSize) / 2;
    this.grid = Array.from({length: this.rows}, () => Array(this.cols).fill(null));
    this.shapes = [
      [[1,1,1,1]], // I
      [[1,1],[1,1]], // O
      [[0,1,0],[1,1,1]], // T
      [[1,0,0],[1,1,1]], // J
      [[0,0,1],[1,1,1]], // L
      [[0,1,1],[1,1,0]], // S
      [[1,1,0],[0,1,1]]  // Z
    ];
    this.colors = ['#00f3ff', '#ffff00', '#bc13fe', '#3aa0ff', '#ff9900', '#ccff00', '#ff0055'];
    this.newPiece();
    this.dropCounter = 0;
    this.dropInterval = 0.8;
  }
  newPiece() {
    const idx = randInt(0, this.shapes.length - 1);
    this.piece = { matrix: this.shapes[idx], color: this.colors[idx], x: Math.floor(this.cols/2) - 1, y: 0 };
    if (this.collide(this.piece.matrix, this.piece.x, this.piece.y)) this.gameOver();
  }
  collide(matrix, ox, oy) {
    for (let y = 0; y < matrix.length; ++y) {
      for (let x = 0; x < matrix[y].length; ++x) {
        if (matrix[y][x] !== 0 &&
           (this.grid[y + oy] && this.grid[y + oy][x + ox]) !== null &&
           (this.grid[y + oy] && this.grid[y + oy][x + ox]) !== undefined) {
          if (this.grid[y+oy][x+ox] !== null) return true;
        }
      }
    }
    // Bounds
    for (let y = 0; y < matrix.length; ++y) {
      for (let x = 0; x < matrix[y].length; ++x) {
        if (matrix[y][x] !== 0) {
          if (x + ox < 0 || x + ox >= this.cols || y + oy >= this.rows) return true;
        }
      }
    }
    return false;
  }
  merge() {
    this.piece.matrix.forEach((row, y) => {
      row.forEach((value, x) => {
        if (value !== 0) this.grid[y + this.piece.y][x + this.piece.x] = this.piece.color;
      });
    });
  }
  rotate(m) {
    const N = m.length;
    const M = m[0].length;
    const res = Array.from({length: M}, () => Array(N).fill(0));
    for (let y = 0; y < N; ++y) for (let x = 0; x < M; ++x) res[x][N-1-y] = m[y][x];
    return res;
  }
  update(dt) {
    this.dropCounter += dt;
    if (this.dropCounter > this.dropInterval) {
      if (!this.collide(this.piece.matrix, this.piece.x, this.piece.y + 1)) {
        this.piece.y++;
      } else {
        this.merge();
        this.clearLines();
        this.newPiece();
      }
      this.dropCounter = 0;
    }
    
    // Controls (Debounced simple implementation)
    if (Input.keys['ArrowLeft']) { if (!this.collide(this.piece.matrix, this.piece.x-1, this.piece.y)) this.piece.x--; Input.keys['ArrowLeft']=false; }
    if (Input.keys['ArrowRight']) { if (!this.collide(this.piece.matrix, this.piece.x+1, this.piece.y)) this.piece.x++; Input.keys['ArrowRight']=false; }
    if (Input.keys['ArrowDown']) { if (!this.collide(this.piece.matrix, this.piece.x, this.piece.y+1)) this.piece.y++; Input.keys['ArrowDown']=false; }
    if (Input.keys['ArrowUp']) { 
      const rotated = this.rotate(this.piece.matrix);
      if (!this.collide(rotated, this.piece.x, this.piece.y)) this.piece.matrix = rotated;
      Input.keys['ArrowUp']=false;
    }
    if (Input.keys['Space']) {
      while (!this.collide(this.piece.matrix, this.piece.x, this.piece.y+1)) this.piece.y++;
      this.merge(); this.clearLines(); this.newPiece();
      Input.keys['Space']=false;
    }
  }
  clearLines() {
    outer: for (let y = this.rows - 1; y >= 0; --y) {
      for (let x = 0; x < this.cols; ++x) {
        if (this.grid[y][x] === null) continue outer;
      }
      const row = this.grid.splice(y, 1)[0].fill(null);
      this.grid.unshift(row);
      ++y;
      this.addScore(10);
      Synth.sfx('collect');
    }
  }
  draw() {
    this.ctx.fillStyle = '#050510';
    this.ctx.fillRect(0, 0, this.W, this.H);
    
    // Draw Grid
    this.ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    for(let x=0; x<=this.cols; x++) { this.ctx.beginPath(); this.ctx.moveTo(this.offsetX + x*this.blockSize, this.offsetY); this.ctx.lineTo(this.offsetX + x*this.blockSize, this.offsetY + this.rows*this.blockSize); this.ctx.stroke(); }
    for(let y=0; y<=this.rows; y++) { this.ctx.beginPath(); this.ctx.moveTo(this.offsetX, this.offsetY + y*this.blockSize); this.ctx.lineTo(this.offsetX + this.cols*this.blockSize, this.offsetY + y*this.blockSize); this.ctx.stroke(); }

    // Draw Locked Blocks
    this.grid.forEach((row, y) => {
      row.forEach((color, x) => {
        if (color) {
          this.ctx.fillStyle = color;
          this.ctx.shadowBlur = 5;
          this.ctx.shadowColor = color;
          this.ctx.fillRect(this.offsetX + x*this.blockSize + 1, this.offsetY + y*this.blockSize + 1, this.blockSize - 2, this.blockSize - 2);
        }
      });
    });

    // Draw Active Piece
    this.ctx.fillStyle = this.piece.color;
    this.ctx.shadowColor = this.piece.color;
    this.ctx.shadowBlur = 10;
    this.piece.matrix.forEach((row, y) => {
      row.forEach((value, x) => {
        if (value !== 0) {
          this.ctx.fillRect(this.offsetX + (x + this.piece.x)*this.blockSize + 1, this.offsetY + (y + this.piece.y)*this.blockSize + 1, this.blockSize - 2, this.blockSize - 2);
        }
      });
    });
    this.ctx.shadowBlur = 0;
  }
}

// 4. SPACE INVADERS
class Invaders extends Game {
  reset() {
    super.reset();
    this.player = { x: this.W/2, y: this.H - 30, w: 30, h: 20, speed: 5 };
    this.bullets = [];
    this.enemies = [];
    this.enemyBullets = [];
    this.dir = 1;
    this.moveTimer = 0;
    this.spawnEnemies();
  }
  spawnEnemies() {
    for(let r=0; r<4; r++) for(let c=0; c<8; c++) {
      this.enemies.push({ x: 50 + c*50, y: 50 + r*40, w: 30, h: 20, alive: true, type: r%2 });
    }
  }
  update(dt) {
    // Player
    if (Input.keys['ArrowLeft']) this.player.x -= this.player.speed;
    if (Input.keys['ArrowRight']) this.player.x += this.player.speed;
    this.player.x = clamp(this.player.x, 15, this.W-15);
    
    if (Input.keys['Space'] && this.bullets.length < 3) {
      this.bullets.push({ x: this.player.x, y: this.player.y - 10, dy: -8 });
      Input.keys['Space'] = false;
      Synth.sfx('shoot');
    }

    // Bullets
    this.bullets.forEach(b => b.y += b.dy);
    this.bullets = this.bullets.filter(b => b.y > 0);
    
    this.enemyBullets.forEach(b => b.y += 5);
    this.enemyBullets = this.enemyBullets.filter(b => b.y < this.H);

    // Enemies Movement
    this.moveTimer += dt;
    if (this.moveTimer > 0.5) {
      this.moveTimer = 0;
      let hitEdge = false;
      this.enemies.forEach(e => {
        if (e.alive) {
          e.x += 10 * this.dir;
          if (e.x < 20 || e.x > this.W - 20) hitEdge = true;
        }
      });
      if (hitEdge) {
        this.dir *= -1;
        this.enemies.forEach(e => { if(e.alive) e.y += 20; });
      }
      // Random Shoot
      const liveEnemies = this.enemies.filter(e => e.alive);
      if (liveEnemies.length > 0 && Math.random() < 0.3) {
        const shooter = liveEnemies[randInt(0, liveEnemies.length-1)];
        this.enemyBullets.push({ x: shooter.x, y: shooter.y + 10 });
      }
    }

    // Collisions
    this.bullets.forEach(b => {
      this.enemies.forEach(e => {
        if (e.alive && b.x > e.x - e.w/2 && b.x < e.x + e.w/2 && b.y > e.y - e.h/2 && b.y < e.y + e.h/2) {
          e.alive = false;
          b.hit = true;
          this.addScore(10);
          Synth.sfx('explode');
          this.createExplosion(e.x, e.y, '#ff0055');
        }
      });
    });
    this.bullets = this.bullets.filter(b => !b.hit);

    this.enemyBullets.forEach(b => {
      if (Math.abs(b.x - this.player.x) < 15 && Math.abs(b.y - this.player.y) < 15) {
        this.gameOver();
      }
    });
    
    if (this.enemies.every(e => !e.alive)) {
      this.addScore(100);
      this.spawnEnemies();
    }
    this.updateParticles(dt);
  }
  draw() {
    this.ctx.fillStyle = '#050510';
    this.ctx.fillRect(0, 0, this.W, this.H);
    
    // Player Ship
    this.ctx.fillStyle = '#00f3ff';
    this.ctx.shadowBlur = 10;
    this.ctx.shadowColor = '#00f3ff';
    this.ctx.beginPath();
    this.ctx.moveTo(this.player.x, this.player.y - 10);
    this.ctx.lineTo(this.player.x + 15, this.player.y + 10);
    this.ctx.lineTo(this.player.x - 15, this.player.y + 10);
    this.ctx.fill();

    // Enemies
    this.enemies.forEach(e => {
      if (!e.alive) return;
      this.ctx.fillStyle = e.type ? '#ff0055' : '#ccff00';
      this.ctx.shadowColor = this.ctx.fillStyle;
      this.ctx.fillRect(e.x - 15, e.y - 10, 30, 20);
      // Eyes
      this.ctx.fillStyle = '#000';
      this.ctx.fillRect(e.x - 8, e.y - 2, 4, 4);
      this.ctx.fillRect(e.x + 4, e.y - 2, 4, 4);
    });

    // Bullets
    this.ctx.fillStyle = '#fff';
    this.ctx.shadowBlur = 0;
    this.bullets.forEach(b => this.ctx.fillRect(b.x - 2, b.y, 4, 10));
    this.ctx.fillStyle = '#ff9900';
    this.enemyBullets.forEach(b => this.ctx.fillRect(b.x - 2, b.y, 4, 10));
    
    this.drawParticles();
  }
}

// 5. FLAPPY BIRD STYLE
class Flappy extends Game {
  reset() {
    super.reset();
    this.bird = { x: this.W * 0.3, y: this.H / 2, vy: 0, r: 15 };
    this.pipes = [];
    this.pipeTimer = 0;
    this.gravity = 0.5;
    this.lift = -8;
  }
  update(dt) {
    if (Input.keys['Space'] || Input.mouse.down) {
      this.bird.vy = this.lift;
      Input.keys['Space'] = false;
      Input.mouse.down = false; // Prevent hold spam
      Synth.sfx('jump');
    }
    
    this.bird.vy += this.gravity;
    this.bird.y += this.bird.vy;
    
    if (this.bird.y > this.H || this.bird.y < 0) this.gameOver();

    this.pipeTimer += dt;
    if (this.pipeTimer > 1.5) {
      this.pipeTimer = 0;
      const gap = 150;
      const minHeight = 50;
      const maxY = this.H - gap - minHeight;
      const topH = randInt(minHeight, maxY);
      this.pipes.push({ x: this.W, top: topH, passed: false });
    }

    this.pipes.forEach(p => {
      p.x -= 3;
      // Collision
      if (this.bird.x + this.bird.r > p.x && this.bird.x - this.bird.r < p.x + 50) {
        if (this.bird.y - this.bird.r < p.top || this.bird.y + this.bird.r > p.top + 150) {
          this.gameOver();
        }
      }
      if (!p.passed && p.x + 50 < this.bird.x) {
        p.passed = true;
        this.addScore(1);
        Synth.sfx('collect');
      }
    });
    this.pipes = this.pipes.filter(p => p.x > -60);
  }
  draw() {
    this.ctx.fillStyle = '#0a0a1a';
    this.ctx.fillRect(0, 0, this.W, this.H);
    
    // Pipes
    this.ctx.fillStyle = '#ccff00';
    this.ctx.shadowBlur = 10;
    this.ctx.shadowColor = '#ccff00';
    this.pipes.forEach(p => {
      this.ctx.fillRect(p.x, 0, 50, p.top);
      this.ctx.fillRect(p.x, p.top + 150, 50, this.H);
    });

    // Bird
    this.ctx.fillStyle = '#ff0055';
    this.ctx.shadowColor = '#ff0055';
    this.ctx.beginPath();
    this.ctx.arc(this.bird.x, this.bird.y, this.bird.r, 0, Math.PI*2);
    this.ctx.fill();
    this.ctx.shadowBlur = 0;
  }
}

// 6. ASTEROIDS
class Asteroids extends Game {
  reset() {
    super.reset();
    this.ship = { x: this.W/2, y: this.H/2, angle: -Math.PI/2, vx: 0, vy: 0, r: 15 };
    this.rocks = [];
    this.shots = [];
    for(let i=0; i<5; i++) this.spawnRock(rand(0,this.W), rand(0,this.H), 3);
  }
  spawnRock(x, y, size) {
    const verts = [];
    const numVerts = randInt(7, 12);
    for(let i=0; i<numVerts; i++) verts.push(rand(0.7, 1.3));
    this.rocks.push({ x, y, vx: rand(-2,2), vy: rand(-2,2), size, r: size*15, verts, angle: 0, va: rand(-0.05, 0.05) });
  }
  update(dt) {
    // Controls
    if (Input.keys['ArrowLeft']) this.ship.angle -= 0.1;
    if (Input.keys['ArrowRight']) this.ship.angle += 0.1;
    if (Input.keys['ArrowUp']) {
      this.ship.vx += Math.cos(this.ship.angle) * 0.2;
      this.ship.vy += Math.sin(this.ship.angle) * 0.2;
    }
    if (Input.keys['Space']) {
      if (this.shots.length < 5) {
        this.shots.push({ x: this.ship.x + Math.cos(this.ship.angle)*20, y: this.ship.y + Math.sin(this.ship.angle)*20, vx: Math.cos(this.ship.angle)*8, vy: Math.sin(this.ship.angle)*8, life: 60 });
        Input.keys['Space'] = false;
        Synth.sfx('shoot');
      }
    }

    // Physics
    this.ship.x += this.ship.vx;
    this.ship.y += this.ship.vy;
    this.ship.vx *= 0.98;
    this.ship.vy *= 0.98;
    
    // Wrap Screen
    if (this.ship.x < 0) this.ship.x = this.W; if (this.ship.x > this.W) this.ship.x = 0;
    if (this.ship.y < 0) this.ship.y = this.H; if (this.ship.y > this.H) this.ship.y = 0;

    this.shots.forEach(s => { s.x += s.vx; s.y += s.vy; s.life--; });
    this.shots = this.shots.filter(s => s.life > 0);

    this.rocks.forEach(r => {
      r.x += r.vx; r.y += r.vy; r.angle += r.va;
      if (r.x < -50) r.x = this.W + 50; if (r.x > this.W + 50) r.x = -50;
      if (r.y < -50) r.y = this.H + 50; if (r.y > this.H + 50) r.y = -50;
      
      // Ship collision
      if (dist(r.x, r.y, this.ship.x, this.ship.y) < r.r + this.ship.r) this.gameOver();
    });

    // Shot vs Rock
    this.shots.forEach(s => {
      this.rocks.forEach(r => {
        if (dist(s.x, s.y, r.x, r.y) < r.r) {
          s.dead = true;
          r.dead = true;
          this.addScore(20 * r.size);
          Synth.sfx('explode');
          this.createExplosion(r.x, r.y, '#00f3ff', 15);
          if (r.size > 1) {
            this.spawnRock(r.x, r.y, r.size - 1);
            this.spawnRock(r.x, r.y, r.size - 1);
          }
        }
      });
    });
    this.shots = this.shots.filter(s => !s.dead);
    this.rocks = this.rocks.filter(r => !r.dead);
    
    if (this.rocks.length === 0) {
      for(let i=0; i<5; i++) this.spawnRock(rand(0,this.W), rand(0,this.H), 3);
    }
    this.updateParticles(dt);
  }
  draw() {
    this.ctx.fillStyle = '#020205';
    this.ctx.fillRect(0, 0, this.W, this.H);
    
    // Stars bg
    this.ctx.fillStyle = '#fff';
    for(let i=0; i<50; i++) this.ctx.fillRect(rand(0,this.W), rand(0,this.H), 1, 1);

    // Rocks
    this.ctx.strokeStyle = '#00f3ff';
    this.ctx.lineWidth = 2;
    this.ctx.shadowBlur = 10;
    this.ctx.shadowColor = '#00f3ff';
    this.rocks.forEach(r => {
      this.ctx.save();
      this.ctx.translate(r.x, r.y);
      this.ctx.rotate(r.angle);
      this.ctx.beginPath();
      r.verts.forEach((vr, i) => {
        const a = (i / r.verts.length) * Math.PI * 2;
        const px = Math.cos(a) * r.r * vr;
        const py = Math.sin(a) * r.r * vr;
        if (i===0) this.ctx.moveTo(px, py); else this.ctx.lineTo(px, py);
      });
      this.ctx.closePath();
      this.ctx.stroke();
      this.ctx.restore();
    });

    // Ship
    this.ctx.save();
    this.ctx.translate(this.ship.x, this.ship.y);
    this.ctx.rotate(this.ship.angle);
    this.ctx.strokeStyle = '#ff0055';
    this.ctx.shadowColor = '#ff0055';
    this.ctx.beginPath();
    this.ctx.moveTo(15, 0);
    this.ctx.lineTo(-10, 10);
    this.ctx.lineTo(-5, 0);
    this.ctx.lineTo(-10, -10);
    this.ctx.closePath();
    this.ctx.stroke();
    this.ctx.restore();

    // Shots
    this.ctx.fillStyle = '#fff';
    this.ctx.shadowBlur = 0;
    this.shots.forEach(s => this.ctx.fillRect(s.x-2, s.y-2, 4, 4));
    
    this.drawParticles();
  }
}

// 7. PONG VS AI
class Pong extends Game {
  reset() {
    super.reset();
    this.p1 = { x: 20, y: this.H/2 - 40, w: 10, h: 80, score: 0 };
    this.p2 = { x: this.W - 30, y: this.H/2 - 40, w: 10, h: 80, score: 0 };
    this.ball = { x: this.W/2, y: this.H/2, dx: 5, dy: 5, r: 8 };
  }
  update(dt) {
    // Player Control (Mouse Y or Keys)
    if (Input.keys['ArrowUp']) this.p1.y -= 7;
    if (Input.keys['ArrowDown']) this.p1.y += 7;
    if (Input.mouse.y > 0) this.p1.y = Input.mouse.y - this.p1.h/2;
    this.p1.y = clamp(this.p1.y, 0, this.H - this.p1.h);

    // AI Control
    const targetY = this.ball.y - this.p2.h/2;
    const diff = targetY - this.p2.y;
    this.p2.y += clamp(diff, -5, 5);
    this.p2.y = clamp(this.p2.y, 0, this.H - this.p2.h);

    // Ball
    this.ball.x += this.ball.dx;
    this.ball.y += this.ball.dy;

    // Wall Bounce
    if (this.ball.y < this.ball.r || this.ball.y > this.H - this.ball.r) this.ball.dy *= -1;

    // Paddle Bounce
    if (checkRectCollide({x:this.ball.x-this.ball.r, y:this.ball.y-this.ball.r, w:this.ball.r*2, h:this.ball.r*2}, this.p1)) {
      this.ball.dx = Math.abs(this.ball.dx) * 1.05;
      this.ball.dy += rand(-2, 2);
      Synth.sfx('hit');
    }
    if (checkRectCollide({x:this.ball.x-this.ball.r, y:this.ball.y-this.ball.r, w:this.ball.r*2, h:this.ball.r*2}, this.p2)) {
      this.ball.dx = -Math.abs(this.ball.dx) * 1.05;
      this.ball.dy += rand(-2, 2);
      Synth.sfx('hit');
    }

    // Score
    if (this.ball.x < 0) { this.p2.score++; this.resetBall(); Synth.sfx('score'); }
    if (this.ball.x > this.W) { this.p1.score++; this.resetBall(); Synth.sfx('score'); }
    
    this.addScore(this.p1.score); // Update HUD
    
    if (this.p1.score >= 5 || this.p2.score >= 5) {
      this.gameOver();
    }
  }
  resetBall() {
    this.ball.x = this.W/2; this.ball.y = this.H/2;
    this.ball.dx = rand(4,6) * (Math.random()>0.5?1:-1);
    this.ball.dy = rand(4,6) * (Math.random()>0.5?1:-1);
  }
  draw() {
    this.ctx.fillStyle = '#050510';
    this.ctx.fillRect(0, 0, this.W, this.H);
    
    // Center Line
    this.ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    this.ctx.setLineDash([10, 10]);
    this.ctx.beginPath(); this.ctx.moveTo(this.W/2, 0); this.ctx.lineTo(this.W/2, this.H); this.ctx.stroke();
    this.ctx.setLineDash([]);

    // Paddles
    this.ctx.fillStyle = '#00f3ff';
    this.ctx.shadowBlur = 15; this.ctx.shadowColor = '#00f3ff';
    this.ctx.fillRect(this.p1.x, this.p1.y, this.p1.w, this.p1.h);
    
    this.ctx.fillStyle = '#ff0055';
    this.ctx.shadowColor = '#ff0055';
    this.ctx.fillRect(this.p2.x, this.p2.y, this.p2.w, this.p2.h);

    // Ball
    this.ctx.fillStyle = '#fff';
    this.ctx.shadowColor = '#fff';
    this.ctx.beginPath(); this.ctx.arc(this.ball.x, this.ball.y, this.ball.r, 0, Math.PI*2); this.ctx.fill();
    this.ctx.shadowBlur = 0;
    
    // Scores Text
    this.ctx.font = "40px Orbitron";
    this.ctx.fillStyle = "#fff";
    this.ctx.textAlign = "center";
    this.ctx.fillText(this.p1.score, this.W/2 - 50, 60);
    this.ctx.fillText(this.p2.score, this.W/2 + 50, 60);
  }
}

// 8. WHACK A MOLE
class Whack extends Game {
  reset() {
    super.reset();
    this.holes = [];
    const R = Math.min(this.W, this.H) * 0.35;
    for(let i=0; i<9; i++) {
      const angle = (i / 9) * Math.PI * 2;
      this.holes.push({
        x: this.W/2 + Math.cos(angle)*R,
        y: this.H/2 + Math.sin(angle)*R,
        state: 'empty', // empty, up, hit
        timer: 0,
        isBomb: false
      });
    }
    this.timeLeft = 30;
  }
  update(dt) {
    this.timeLeft -= dt;
    if (this.timeLeft <= 0) this.gameOver();

    // Spawn Logic
    this.holes.forEach(h => {
      if (h.state === 'empty') {
        if (Math.random() < 0.02) {
          h.state = 'up';
          h.timer = rand(0.8, 1.5);
          h.isBomb = Math.random() < 0.2;
        }
      } else if (h.state === 'up') {
        h.timer -= dt;
        if (h.timer <= 0) h.state = 'empty';
      } else if (h.state === 'hit') {
        h.timer -= dt;
        if (h.timer <= 0) h.state = 'empty';
      }
    });

    // Click Detection
    if (Input.mouse.down) {
      Input.mouse.down = false;
      this.holes.forEach(h => {
        if (h.state === 'up' && dist(Input.mouse.x, Input.mouse.y, h.x, h.y) < 40) {
          if (h.isBomb) {
            this.timeLeft -= 5;
            Synth.sfx('die');
            this.createExplosion(h.x, h.y, '#ff0055', 20);
          } else {
            this.addScore(10);
            Synth.sfx('collect');
            this.createExplosion(h.x, h.y, '#ccff00', 10);
          }
          h.state = 'hit';
          h.timer = 0.3;
        }
      });
    }
    this.updateParticles(dt);
  }
  draw() {
    this.ctx.fillStyle = '#0a1a12';
    this.ctx.fillRect(0, 0, this.W, this.H);
    
    this.holes.forEach(h => {
      // Hole Base
      this.ctx.fillStyle = '#000';
      this.ctx.beginPath(); this.ctx.ellipse(h.x, h.y+10, 30, 15, 0, 0, Math.PI*2); this.ctx.fill();
      
      if (h.state === 'up') {
        this.ctx.fillStyle = h.isBomb ? '#ff0055' : '#ccff00';
        this.ctx.shadowBlur = 10; this.ctx.shadowColor = this.ctx.fillStyle;
        this.ctx.beginPath(); this.ctx.arc(h.x, h.y - 10, 20, 0, Math.PI*2); this.ctx.fill();
        if (h.isBomb) {
          this.ctx.fillStyle = '#fff'; this.ctx.font = '20px Arial'; this.ctx.textAlign='center'; this.ctx.fillText('☢', h.x, h.y-3);
        }
        this.ctx.shadowBlur = 0;
      } else if (h.state === 'hit') {
        this.ctx.fillStyle = '#fff';
        this.ctx.globalAlpha = h.timer / 0.3;
        this.ctx.beginPath(); this.ctx.arc(h.x, h.y - 10, 20 * (1-h.timer/0.3), 0, Math.PI*2); this.ctx.fill();
        this.ctx.globalAlpha = 1;
      }
    });
    
    // Timer Bar
    this.ctx.fillStyle = '#333';
    this.ctx.fillRect(20, 20, this.W-40, 10);
    this.ctx.fillStyle = '#00f3ff';
    this.ctx.fillRect(20, 20, (this.W-40) * (this.timeLeft/30), 10);
    
    this.drawParticles();
  }
}

// 9. MEMORY MATCH
class Memory extends Game {
  reset() {
    super.reset();
    this.cards = [];
    const symbols = ['★','♦','♣','♠','♥','●','▲','■'];
    const deck = [...symbols, ...symbols];
    // Shuffle
    for (let i = deck.length - 1; i > 0; i--) { const j = randInt(0, i); [deck[i], deck[j]] = [deck[j], deck[i]]; }
    
    const cols = 4, rows = 4;
    const cw = (this.W - 50) / cols;
    const ch = (this.H - 100) / rows;
    
    deck.forEach((sym, i) => {
      const c = i % cols;
      const r = Math.floor(i / cols);
      this.cards.push({
        x: 25 + c*cw, y: 50 + r*ch, w: cw-10, h: ch-10,
        sym, flipped: false, matched: false, anim: 0
      });
    });
    this.flippedStack = [];
    this.locked = false;
    this.startTime = Date.now();
  }
  update(dt) {
    if (this.locked) {
      this.lockTimer -= dt;
      if (this.lockTimer <= 0) {
        this.flippedStack.forEach(c => c.flipped = false);
        this.flippedStack = [];
        this.locked = false;
      }
    }
    
    // Animation interpolation
    this.cards.forEach(c => {
      const target = (c.flipped || c.matched) ? 1 : 0;
      c.anim = lerp(c.anim, target, 0.2);
    });

    if (Input.mouse.down && !this.locked) {
      Input.mouse.down = false;
      const clicked = this.cards.find(c => !c.flipped && !c.matched && Input.mouse.x > c.x && Input.mouse.x < c.x+c.w && Input.mouse.y > c.y && Input.mouse.y < c.y+c.h);
      if (clicked) {
        clicked.flipped = true;
        this.flippedStack.push(clicked);
        Synth.sfx('click');
        
        if (this.flippedStack.length === 2) {
          this.locked = true;
          this.lockTimer = 1.0;
          const [a, b] = this.flippedStack;
          if (a.sym === b.sym) {
            a.matched = b.matched = true;
            this.addScore(50);
            Synth.sfx('collect');
            this.flippedStack = [];
            this.locked = false;
            
            if (this.cards.every(c => c.matched)) {
              const timeBonus = Math.max(0, 1000 - (Date.now()-this.startTime)/10);
              this.addScore(Math.floor(timeBonus));
              this.gameOver(); // Win condition treated as end for simplicity in this engine structure
            }
          }
        }
      }
    }
  }
  draw() {
    this.ctx.fillStyle = '#120a24';
    this.ctx.fillRect(0, 0, this.W, this.H);
    
    this.cards.forEach(c => {
      const face = c.flipped || c.matched;
      const scaleY = face ? c.anim : 1 - c.anim;
      const showFace = c.anim > 0.5;
      
      this.ctx.save();
      this.ctx.translate(c.x + c.w/2, c.y + c.h/2);
      this.ctx.scale(1, scaleY);
      
      if (showFace) {
        this.ctx.fillStyle = '#0a0a1a';
        this.ctx.strokeStyle = c.matched ? '#ccff00' : '#bc13fe';
        this.ctx.lineWidth = 2;
        this.ctx.shadowBlur = c.matched ? 15 : 5;
        this.ctx.shadowColor = this.ctx.strokeStyle;
        this.ctx.fillRect(-c.w/2, -c.h/2, c.w, c.h);
        this.ctx.strokeRect(-c.w/2, -c.h/2, c.w, c.h);
        
        this.ctx.fillStyle = this.ctx.strokeStyle;
        this.ctx.font = `${c.h*0.5}px Arial`;
        this.ctx.textAlign = 'center';
        this.ctx.textBaseline = 'middle';
        this.ctx.fillText(c.sym, 0, 0);
      } else {
        this.ctx.fillStyle = '#2a1a4a';
        this.ctx.fillRect(-c.w/2, -c.h/2, c.w, c.h);
        this.ctx.strokeStyle = '#bc13fe';
        this.ctx.strokeRect(-c.w/2, -c.h/2, c.w, c.h);
        this.ctx.fillStyle = '#bc13fe';
        this.ctx.font = 'bold 20px Orbitron';
        this.ctx.textAlign = 'center';
        this.ctx.textBaseline = 'middle';
        this.ctx.fillText('?', 0, 0);
      }
      this.ctx.restore();
    });
  }
}

// 10. CYBER RUNNER
class Runner extends Game {
  reset() {
    super.reset();
    this.player = { x: 100, y: this.H - 50, vy: 0, grounded: true };
    this.obstacles = [];
    this.speed = 5;
    this.dist = 0;
    this.jumpForce = -12;
    this.gravity = 0.6;
  }
  update(dt) {
    this.dist += this.speed;
    this.speed = 5 + this.dist / 5000; // Speed up over time
    
    // Jump
    if ((Input.keys['Space'] || Input.mouse.down) && this.player.grounded) {
      this.player.vy = this.jumpForce;
      this.player.grounded = false;
      Synth.sfx('jump');
      Input.keys['Space'] = false;
      Input.mouse.down = false;
    }
    
    this.player.vy += this.gravity;
    this.player.y += this.player.vy;
    
    if (this.player.y >= this.H - 50) {
      this.player.y = this.H - 50;
      this.player.vy = 0;
      this.player.grounded = true;
    }
    
    // Spawn Obstacles
    if (Math.random() < 0.02 + (this.speed/1000)) {
      const type = Math.random() > 0.5 ? 'ground' : 'air';
      this.obstacles.push({
        x: this.W,
        y: type === 'ground' ? this.H - 50 : this.H - 120,
        w: 30, h: type === 'ground' ? 40 : 20,
        type
      });
    }
    
    this.obstacles.forEach(o => o.x -= this.speed);
    this.obstacles = this.obstacles.filter(o => o.x > -50);
    
    // Collision
    const pBox = { x: this.player.x - 10, y: this.player.y - 30, w: 20, h: 30 };
    for (let o of this.obstacles) {
      if (checkRectCollide(pBox, o)) {
        this.gameOver();
        return;
      }
    }
    
    this.addScore(Math.floor(this.dist/10));
  }
  draw() {
    // Background Parallax
    this.ctx.fillStyle = '#050510';
    this.ctx.fillRect(0, 0, this.W, this.H);
    
    // City Silhouette
    this.ctx.fillStyle = '#1a0a2e';
    const offset = -(this.dist * 0.2) % 100;
    for(let i=-1; i<this.W/100 + 1; i++) {
      const h = 100 + Math.sin(i*13)*50;
      this.ctx.fillRect(offset + i*100, this.H - 50 - h, 80, h);
    }
    
    // Ground
    this.ctx.strokeStyle = '#ff0055';
    this.ctx.lineWidth = 3;
    this.ctx.shadowBlur = 10;
    this.ctx.shadowColor = '#ff0055';
    this.ctx.beginPath();
    this.ctx.moveTo(0, this.H - 50);
    this.ctx.lineTo(this.W, this.H - 50);
    this.ctx.stroke();
    this.ctx.shadowBlur = 0;
    
    // Grid Floor
    this.ctx.strokeStyle = 'rgba(255,0,85,0.2)';
    this.ctx.lineWidth = 1;
    const floorOffset = -(this.dist) % 50;
    for(let i=floorOffset; i<this.W; i+=50) {
      this.ctx.beginPath(); this.ctx.moveTo(i, this.H-50); this.ctx.lineTo(i-50, this.H); this.ctx.stroke();
    }

    // Player
    this.ctx.fillStyle = '#00f3ff';
    this.ctx.shadowBlur = 15;
    this.ctx.shadowColor = '#00f3ff';
    this.ctx.fillRect(this.player.x - 10, this.player.y - 30, 20, 30);
    // Eye
    this.ctx.fillStyle = '#fff';
    this.ctx.fillRect(this.player.x + 2, this.player.y - 25, 5, 5);
    this.ctx.shadowBlur = 0;
    
    // Obstacles
    this.ctx.fillStyle = '#ff9900';
    this.ctx.shadowColor = '#ff9900';
    this.ctx.shadowBlur = 10;
    this.obstacles.forEach(o => {
      this.ctx.fillRect(o.x, o.y - o.h, o.w, o.h);
    });
    this.ctx.shadowBlur = 0;
  }
}

    const onUpdateScore = (score) => {
      document.getElementById('hudScore').innerText = `SCORE: ${score}`;
    };
    
    this.currentGame = new gameDef.class(this.canvas, this.ctx, this.canvas.width, this.canvas.height, onGameOver, onUpdateScore);
    
    // Show Start Overlay
    document.getElementById('startOverlay').classList.remove('overlay-hidden');
    document.getElementById('endOverlay').classList.add('overlay-hidden');
    document.getElementById('ovTitle').innerText = gameDef.name.toUpperCase();
    document.getElementById('ovDesc').innerText = gameDef.desc;
    
    document.getElementById('startGameBtn').onclick = () => {
      document.getElementById('startOverlay').classList.add('overlay-hidden');
      this.currentGame.start();
    };
  },
  
  setupEvents() {
    document.getElementById('closeBtn').onclick = () => {
      if (this.currentGame) this.currentGame.stop();
      document.getElementById('gameModal').classList.remove('open');
      Synth.playMusic('lobby');
    };
    
    document.getElementById('restartBtn').onclick = () => {
      if (this.currentGame) {
        this.currentGame.stop();
        this.currentGame.reset();
        this.currentGame.start();
        document.getElementById('endOverlay').classList.add('overlay-hidden');
      }
    };
    
    document.getElementById('retryBtn').onclick = () => {
       if (this.currentGame) {
        this.currentGame.stop();
        this.currentGame.reset();
        this.currentGame.start();
        document.getElementById('endOverlay').classList.add('overlay-hidden');
      }
    };
    
    document.getElementById('soundBtn').onclick = () => {
      const isOn = Synth.toggleMute();
      const btn = document.getElementById('soundBtn');
      btn.innerText = isOn ? "SOUND: ON" : "SOUND: OFF";
      btn.classList.toggle('active', isOn);
    };
    
    // Init Input Manager once
    Input.init(this.canvas);
  }
};

// Boot
window.onload = () => App.init();

</script>
</body>
</html>
